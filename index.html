<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daniel & Belén</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<main class="container">

    <p class="instruction">
        Pulsa el sobre
    </p>

    <section class="scene">

        <div class="envelope" id="envelope">

            <!-- ========================= -->
            <!-- CARTA -->
            <!-- ========================= -->

            <div class="letter">

                <div class="paper">

                    <div class="letter-content">

                        <h1>Daniel</h1>

                        <div class="ampersand">&</div>

                        <h1>Belén</h1>

                        <div class="divider"></div>

                        <p class="subtitle">
                            Nos casamos
                        </p>

                    </div>

                </div>

            </div>

            <!-- ========================= -->
            <!-- PARTE TRASERA -->
            <!-- ========================= -->

            <div class="envelope-back"></div>

            <!-- ========================= -->
            <!-- BOLSILLO DEL SOBRE -->
            <!-- ========================= -->

            <div class="envelope-pocket">

                <div class="pocket-left"></div>

                <div class="pocket-right"></div>

                <div class="pocket-bottom"></div>

            </div>

            <!-- ========================= -->
            <!-- SOLAPA -->
            <!-- ========================= -->

            <div class="flap"></div>

            <!-- ========================= -->
            <!-- LACRE -->
            <!-- ========================= -->

            <div class="seal">

                <span>DB</span>

            </div>

        </div>

    </section>

</main>

<script src="app.js"></script>

</body>

</html>
